name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the build output and nothing here reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Tauri crate links against the system WebView on Linux, so the app
      # crate cannot compile without these even to run its tests.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The frontend bundle is an input to the Rust build: tauri.conf.json
      # points `frontendDist` at ui/dist, and codegen fails without it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm test
        working-directory: ui
      - run: pnpm build
        working-directory: ui

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Test
        run: pnpm test
        working-directory: ui

      # `pnpm build` runs svelte-check before bundling, so this covers both
      # type errors and accessibility warnings.
      - name: Typecheck and bundle
        run: pnpm build
        working-directory: ui

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A P2P client handling credentials should not be quietly carrying a
      # crate with a published advisory.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: pnpm audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level moderate
        working-directory: ui
