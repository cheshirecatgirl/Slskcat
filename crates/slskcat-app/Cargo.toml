[package]
name = "slskcat-app"
description = "slsk.cat, a lightweight Soulseek client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "slskcat_app"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Set by `tauri build`, and the switch that decides what the binary is.
#
# `tauri`'s build script computes `dev = !custom-protocol`, and `dev` is what
# `generate_context!` reads: without this feature it embeds nothing and points
# the window at `devUrl` — `http://localhost:5173` — in every profile, release
# included. A bundle built that way installs fine and opens a blank window on
# any machine that is not running Vite. Declaring the feature is what lets the
# CLI turn it off, so the frontend is compiled in instead.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slskcat-core = { path = "../slskcat-core" }
# `protocol-asset` is what lets the player read a finished file back off this
# machine. The scope is empty in `tauri.conf.json` and set at runtime from the
# folders the user actually chose, so enabling the feature grants nothing on
# its own.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The password belongs in the OS credential store, never in the settings file.
# The default `v1` feature covers Keychain, Credential Manager and the
# D-Bus Secret Service, so no per-platform wiring or libsecret headers.
keyring = "4"
# Tag and cover-art reading for the album view. Five crates all told, and the
# only one of them that is not lofty itself is a base64 decoder.
#
# `default-features = false` does not build: lofty 0.25.1 references
# `Id3v2Error` from code that is not behind the same cfg as the type, so the
# compression feature has to stay on.
lofty = "0.25.1"
