[package]
name = "lark-app"
description = "Lark, a lightweight Soulseek client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "lark_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lark-core = { path = "../lark-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The password belongs in the OS credential store, never in the settings file.
# The default `v1` feature covers Keychain, Credential Manager and the
# D-Bus Secret Service, so no per-platform wiring or libsecret headers.
keyring = "4"
